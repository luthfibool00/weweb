<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUTZ // SECURE OPS - ULTIMATE EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05080c; --card: rgba(15, 20, 25, 0.75); --accent: #00ff66; --cyan: #00f2ff; --text: #e2e8f0; --border: rgba(0, 255, 102, 0.2); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        #matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; pointer-events: none; }

        /* SIDEBAR */
        .sidebar { width: 260px; background: rgba(5, 8, 12, 0.9); border-right: 1px solid var(--border); display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 10; }
        .brand { padding: 24px; font-family: 'JetBrains Mono'; font-size: 1.2rem; font-weight: 700; color: var(--cyan); border-bottom: 1px solid var(--border); text-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
        .nav-links { padding: 20px 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: #a0aec0; text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-item.active, .nav-item:hover { background: rgba(0, 255, 102, 0.1); color: var(--accent); border-left: 4px solid var(--accent); }
        .profile { padding: 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, var(--cyan), var(--accent)); border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'JetBrains Mono'; }

        /* MAIN CONTENT */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; z-index: 5; }
        .header { background: rgba(15, 20, 25, 0.8); padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
        .header h1 { font-family: 'JetBrains Mono'; font-size: 1.2rem; color: var(--text); }
        .header-actions button { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .header-actions button:hover { background: var(--accent); color: #000; }

        /* VIEWS (SPA LOGIC) */
        .view-section { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; display: none; animation: fadeIn 0.4s ease-out forwards; }
        .view-section.active-view { display: block; }
        #view-dashboard.active-view { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS & INPUTS */
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .card h2 { font-family: 'JetBrains Mono'; font-size: 0.9rem; color: var(--accent); margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px dashed rgba(0,255,102,0.3); padding-bottom: 8px; }
        input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #2d3748; color: #fff; padding: 12px; margin-top: 10px; border-radius: 6px; font-family: 'JetBrains Mono'; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn-action { background: linear-gradient(135deg, var(--cyan) 0%, var(--accent) 100%); border: none; color: #000; padding: 12px; width: 100%; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 15px; font-family: 'Outfit'; }
        .console-box { background: #000; padding: 20px; height: 60vh; overflow-y: auto; border-radius: 6px; border: 1px solid #1a202c; font-family: 'JetBrains Mono'; font-size: 0.9rem; line-height: 1.6; }
        .result-text { font-family: 'JetBrains Mono'; font-size: 0.9rem; color: var(--accent); margin-top: 15px; }
        .stat-huge { font-size: 2.5rem; font-weight: bold; color: #fff; margin: 10px 0; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        /* MOBILE RESPONSIVE FIX */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; padding: 10px 20px; border-right: none; border-bottom: 1px solid var(--border); }
            .brand { padding: 0; border: none; }
            .nav-links, .profile { display: none; } 
            .main-content { overflow-y: visible; }
            .header { flex-direction: column; gap: 15px; padding: 15px; text-align: center; }
            .view-section { padding: 15px; }
            .console-box { height: 50vh; }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <aside class="sidebar">
        <div class="brand">LUTZ // OS</div>
        <div class="nav-links">
            <div class="nav-item active" data-target="view-dashboard">⊞ Widgets Panel</div>
            <div class="nav-item" data-target="view-terminal">💻 System Terminal</div>
        </div>
        <div class="profile">
            <div class="avatar">LA</div>
            <div>
                <div style="font-weight: 600; font-size: 0.95rem; color:#fff;">Luthfi Akbar</div>
                <div style="font-size: 0.75rem; color: var(--accent);">System Architect</div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 id="header-title">WIDGETS PANEL</h1>
            <div class="header-actions">
                <button id="btn-audio">🎵 AUDIO: OFF</button>
            </div>
        </header>

        <!-- VIEW 1: DASHBOARD -->
        <div id="view-dashboard" class="view-section active-view">
            <div class="card">
                <h2>// LIVE BANDWIDTH DIAGNOSTICS</h2>
                <div class="stat-huge" id="speed-res">0.00 <span style="font-size:1rem; color:var(--cyan)">Mbps</span></div>
                <button class="btn-action" onclick="app.runLiveSpeedTest()" style="margin-top:auto;">RUN BENCHMARK</button>
            </div>

            <div class="card">
                <h2>// LIVE GLOBAL IP TRACKER</h2>
                <input type="text" id="ip-in" placeholder="Target IP (Kosongkan untuk IP sendiri)...">
                <button class="btn-action" onclick="app.traceLiveIP()">TRACE NODE</button>
                <div id="ip-res" class="result-text" style="font-size: 0.8rem;">[ STANDBY ]</div>
            </div>

            <div class="card">
                <h2>// AGE ANALYSIS ENGINE</h2>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="age-d" placeholder="DD">
                    <input type="number" id="age-m" placeholder="MM">
                    <input type="number" id="age-y" placeholder="YYYY">
                </div>
                <button class="btn-action" onclick="app.calculateAge()">EXECUTE ANALYSIS</button>
                <div id="age-res" class="result-text">[ STANDBY ]</div>
            </div>

            <div class="card">
                <h2>// SHA-256 CRYPTO HASH</h2>
                <input type="text" id="crypto-in" placeholder="Data rahasia...">
                <button class="btn-action" onclick="app.generateHash()">ENCRYPT DATA</button>
                <div id="crypto-res" class="result-text" style="font-size:0.75rem; word-break:break-all;">[ STANDBY ]</div>
            </div>
        </div>

        <!-- VIEW 2: TERMINAL (TERMUX STYLE) -->
        <div id="view-terminal" class="view-section">
            <div class="card">
                <h2>// KERNEL CONSOLE (LIVE LOGS & CLI)</h2>
                <div id="term-out" class="console-box"></div>
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 6px; border: 1px solid var(--accent);">
                    <span style="color:var(--accent); font-family:'JetBrains Mono'; font-weight:bold;">root@lutz:~#</span>
                    <input type="text" id="term-in" placeholder="Ketik 'help' di sini..." style="margin-top:0; border:none; background:transparent; box-shadow:none; padding:10px;">
                </div>
            </div>
        </div>

    </main>

<script>
    class LutzSystem {
        constructor() {
            this.initMatrix();
            this.initAudio();
            this.initTerminal();
            this.initNavigation();
        }

        initMatrix() {
            const c = document.getElementById('matrix'), ctx = c.getContext('2d');
            const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
            window.addEventListener('resize', resize); resize();
            const d = Array(Math.floor(c.width / 15)).fill(1);
            setInterval(() => {
                ctx.fillStyle = 'rgba(5,8,12,0.1)'; ctx.fillRect(0,0,c.width,c.height);
                ctx.fillStyle = '#004422'; ctx.font = '14px JetBrains Mono';
                d.forEach((y, i) => { ctx.fillText(String.fromCharCode(Math.random() * 128), i * 15, y * 15); d[i] = y > c.height / 15 ? 0 : y + 1; });
            }, 50);
        }

        initAudio() {
            const btn = document.getElementById('btn-audio');
            const music = document.getElementById('bgMusic');
            btn.addEventListener('click', () => {
                if (music.paused) {
                    music.play().then(() => { btn.innerText = "🎵 AUDIO: ON"; btn.style.background = "var(--accent)"; btn.style.color = "#000"; }).catch(() => alert("File musik.mp3 tidak ditemukan!"));
                } else {
                    music.pause(); btn.innerText = "🎵 AUDIO: OFF"; btn.style.background = "transparent"; btn.style.color = "var(--accent)";
                }
            });
        }

        initNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const views = document.querySelectorAll('.view-section');
            const headerTitle = document.getElementById('header-title');

            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    navItems.forEach(nav => nav.classList.remove('active'));
                    views.forEach(view => view.classList.remove('active-view'));
                    
                    const clickedItem = e.currentTarget;
                    clickedItem.classList.add('active');
                    
                    const targetId = clickedItem.getAttribute('data-target');
                    document.getElementById(targetId).classList.add('active-view');
                    headerTitle.innerText = clickedItem.innerText.replace(/[^a-zA-Z ]/g, "").trim().toUpperCase();
                });
            });
        }

        // --- LINUX / TERMUX COMMAND ENGINE ---
        initTerminal() {
            this.vfs = JSON.parse(localStorage.getItem('lfs') || '{"readme.txt":"System Ready. Welcome to LutzOS."}');
            const out = document.getElementById('term-out'), inpt = document.getElementById('term-in');
            
            out.innerHTML = `
                <div>Terminal Instance Loaded. Establishing Live Kernel... [OK]</div>
                <div style="margin-bottom:10px;">Type <span style="color:var(--accent)">'help'</span> to see available commands.</div>
            `;
            
            inpt.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    let cmd = inpt.value.trim();
                    if(!cmd) return;
                    
                    out.innerHTML += `<div><span style="color:var(--accent)">root@lutz:~#</span> ${cmd}</div>`;
                    inpt.value = '';
                    
                    let args = cmd.split(' ');
                    let op = args[0].toLowerCase();
                    let arg = args.slice(1).join(' '); 
                    
                    if (op === 'help') {
                        out.innerHTML += `
                        <div style="color:#a0aec0; padding-left:10px; border-left:2px solid var(--accent); margin:5px 0;">
                            Available commands:<br>
                            - <span style="color:var(--cyan)">help</span>    : Show this menu<br>
                            - <span style="color:var(--cyan)">ls</span>      : List directory contents<br>
                            - <span style="color:var(--cyan)">touch</span>   : Create a new file (usage: touch [filename])<br>
                            - <span style="color:var(--cyan)">rm</span>      : Remove a file (usage: rm [filename])<br>
                            - <span style="color:var(--cyan)">cat</span>     : Read a file (usage: cat [filename])<br>
                            - <span style="color:var(--cyan)">whoami</span>  : Print effective userid<br>
                            - <span style="color:var(--cyan)">pwd</span>     : Print working directory<br>
                            - <span style="color:var(--cyan)">date</span>    : Print system date and time<br>
                            - <span style="color:var(--cyan)">echo</span>    : Print text to terminal<br>
                            - <span style="color:var(--cyan)">uname</span>   : Print operating system name<br>
                            - <span style="color:var(--cyan)">neofetch</span>: Show system information<br>
                            - <span style="color:var(--cyan)">clear</span>   : Clear terminal screen
                        </div>`;
                    }
                    else if (op === 'ls') {
                        let files = Object.keys(this.vfs);
                        out.innerHTML += `<div>${files.length > 0 ? files.join(' &nbsp;&nbsp; ') : '(empty)'}</div>`;
                    }
                    else if (op === 'touch') {
                        if(arg) {
                            this.vfs[arg] = ""; 
                            localStorage.setItem('lfs', JSON.stringify(this.vfs));
                        } else out.innerHTML += `<div style="color:#ff4444">touch: missing file operand</div>`;
                    }
                    else if (op === 'rm') {
                        if(arg && this.vfs[arg] !== undefined) {
                            delete this.vfs[arg]; 
                            localStorage.setItem('lfs', JSON.stringify(this.vfs));
                        } else out.innerHTML += `<div style="color:#ff4444">rm: cannot remove '${arg}': No such file or directory</div>`;
                    }
                    else if (op === 'cat') {
                        if(arg && this.vfs[arg] !== undefined) out.innerHTML += `<div>${this.vfs[arg] || '(empty file)'}</div>`;
                        else out.innerHTML += `<div style="color:#ff4444">cat: ${arg}: No such file or directory</div>`;
                    }
                    else if (op === 'echo') out.innerHTML += `<div>${arg}</div>`;
                    else if (op === 'whoami') out.innerHTML += `<div>root</div>`;
                    else if (op === 'pwd') out.innerHTML += `<div>/home/root/lutz-os</div>`;
                    else if (op === 'date') out.innerHTML += `<div>${new Date().toString()}</div>`;
                    else if (op === 'uname') out.innerHTML += `<div>LutzOS Linux 5.15.0-generic x86_64</div>`;
                    else if (op === 'neofetch') {
                        let uptime = Math.floor(performance.now() / 60000); 
                        out.innerHTML += `
                        <div style="display:flex; gap:15px; color:var(--text); margin:10px 0;">
                            <pre style="margin:0; color:var(--accent); font-family:'JetBrains Mono'; font-weight:bold;">
    .----.
   /  ..  \\
  |  /  \\  |
   \\  \\' /
    \`----'
                            </pre>
                            <div>
                                <span style="color:var(--accent)">root@lutz</span><br>
                                ----------------<br>
                                <span style="color:var(--cyan)">OS</span>: LutzOS Live (Web Env)<br>
                                <span style="color:var(--cyan)">Kernel</span>: 5.15.0-generic<br>
                                <span style="color:var(--cyan)">Uptime</span>: ${uptime} mins<br>
                                <span style="color:var(--cyan)">Packages</span>: 42 (npm)<br>
                                <span style="color:var(--cyan)">Shell</span>: lutz-bash 5.1.16<br>
                                <span style="color:var(--cyan)">Terminal</span>: Web-Console
                            </div>
                        </div>`;
                    }
                    else if (op === 'clear') out.innerHTML = '';
                    else {
                        out.innerHTML += `<div style="color:#ff4444">bash: ${op}: command not found. Type 'help' for available commands.</div>`;
                    }
                    
                    out.scrollTop = out.scrollHeight;
                }
            });
        }

        // --- FETCH SPEED DARI CLOUDFLARE CDN ---
        async runLiveSpeedTest() {
            const res = document.getElementById('speed-res');
            const termOut = document.getElementById('term-out');
            res.innerHTML = "Downloading Data...";
            
            try {
                const startTime = Date.now();
                await fetch('https://speed.cloudflare.com/__down?bytes=25000000', { cache: 'no-store' });
                const endTime = Date.now();
                
                const durationInSeconds = (endTime - startTime) / 1000;
                const speedMbps = (25 / durationInSeconds).toFixed(2);
                
                res.innerHTML = `${speedMbps} <span style="font-size:1rem; color:var(--cyan)">Mbps</span>`;
                
                if (termOut) {
                    termOut.innerHTML += `<div><span style="color:var(--cyan)">[NETWORK]</span> Live Benchmark Complete: ${speedMbps} Mbps.</div>`;
                    termOut.scrollTop = termOut.scrollHeight;
                }
            } catch(error) {
                res.innerHTML = `<span style="color:#ff4444; font-size:1rem;">API CORS/NETWORK ERROR</span>`;
                if (termOut) termOut.innerHTML += `<div><span style="color:#ff4444">[ERR] Speed Test API unreachable.</span></div>`;
            }
        }

        // --- FETCH LOKASI DARI IPAPI ---
        async traceLiveIP() {
            let ip = document.getElementById('ip-in').value.trim();
            const res = document.getElementById('ip-res');
            const termOut = document.getElementById('term-out');
            res.innerHTML = "Connecting to Global Node...";
            
            try {
                const response = await fetch(ip ? `https://ipapi.co/${ip}/json/` : `https://ipapi.co/json/`);
                const data = await response.json();
                
                if(data.error) throw new Error("Invalid IP");

                res.innerHTML = `
                    IP: <span style="color:#fff">${data.ip}</span> <br>
