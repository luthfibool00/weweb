<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lutz - Cyber Security Lab</title>
    <style>
        :root { --accent: #00ff66; --bg: #050505; --card-bg: rgba(0, 20, 10, 0.8); --text: #c9d1d9; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; }
        
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-nama { padding: 12px; border: 1px solid var(--accent); background: #000; color: var(--accent); text-align: center; margin-bottom: 10px; width: 250px; }
        .btn-start { padding: 12px 30px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; color: #000; }

        .main-wrapper { display: none; padding: 20px; max-width: 800px; margin: auto; }
        .section { margin-bottom: 20px; padding: 20px; background: var(--card-bg); border: 1px solid var(--accent); border-radius: 8px; }
        
        .terminal-box { background: #000; padding: 10px; border: 1px solid var(--accent); height: 120px; overflow-y: auto; font-size: 0.8rem; color: var(--accent); }
        .terminal-input { background: transparent; border: none; color: var(--text); width: 100%; outline: none; }
        .calc-box { border: 1px dashed var(--accent); padding: 10px; margin-top: 10px; }
        .ctrl-btn { background: var(--accent); color: #000; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <input type="text" id="namaInput" class="input-nama" placeholder="Masukkan nama..." autocomplete="off">
        <button class="btn-start" onclick="mulai()">INITIALIZE ACCESS</button>
    </div>

    <div class="main-wrapper" id="konten">
        <div class="section">
            <h1 style="color:var(--accent)">LUTZ LAB</h1>
            <p>Access granted: <span id="namaUser" style="color:var(--accent);"></span></p>
            <button class="ctrl-btn" id="music-btn" onclick="toggleMusic()">🎵 AKTIFKAN MUSIK</button>
        </div>

        <div class="section">
            <h2>// SECURE TERMINAL</h2>
            <div class="terminal-box" id="terminal-output">System ready... (Ketik 'help')<br></div>
            <input type="text" id="terminal-text" class="terminal-input" placeholder="root@lutz:~$" onkeydown="handleTerminal(event)">
        </div>

        <div class="section">
            <h2>// LAB & NETWORK</h2>
            <button class="ctrl-btn" onclick="runPing()">PING GATEWAY</button>
            <div id="ping-result" style="margin-top:10px;"></div>
            
            <div class="calc-box">
                <input type="number" id="h" class="input-date" placeholder="Tgl" style="width:40px;">
                <input type="number" id="b" class="input-date" placeholder="Bln" style="width:40px;">
                <input type="number" id="t" class="input-date" placeholder="Thn" style="width:40px;">
                <button class="ctrl-btn" onclick="hitung()">HITUNG USIA</button>
                <div id="hasil" style="margin-top:10px; font-weight:bold;"></div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <script>
        // 1. Inisialisasi Akses
        function mulai() {
            let nama = document.getElementById("namaInput").value;
            if(nama == "") { alert("Masukkan nama!"); return; }
            document.getElementById("namaUser").innerText = nama;
            document.getElementById("login-overlay").style.display = 'none';
            document.getElementById("konten").style.display = 'block';
        }

        // 2. Musik (Safe Toggle)
        function toggleMusic() {
            let music = document.getElementById("bgMusic");
            let btn = document.getElementById("music-btn");
            try {
                if (music.paused) {
                    music.play();
                    btn.innerText = "🎵 MUSIK: ON";
                } else {
                    music.pause();
                    btn.innerText = "🎵 AKTIFKAN MUSIK";
                }
            } catch(e) {
                alert("Audio tidak bisa diputar.");
            }
        }

        // 3. Network Test
        function runPing() {
            document.getElementById("ping-result").innerText = "Pinging 192.168.87.1...";
            setTimeout(() => {
                document.getElementById("ping-result").innerHTML = "Reply from 192.168.87.1: time=<span style='color:var(--accent)'>12ms</span>";
            }, 1000);
        }

        // 4. Terminal Handler
        function handleTerminal(e) {
            if (e.key === 'Enter') {
                let input = document.getElementById("terminal-text");
                let out = document.getElementById("terminal-output");
                if(input.value == "") return;
                
                out.innerHTML += `root@lutz:~$ ${input.value}<br>`;
                if(input.value.toLowerCase() == 'help') out.innerHTML += `Cmds: help, ping, about, clear<br>`;
                else if(input.value.toLowerCase() == 'ping') out.innerHTML += `Pinging gateway... stable.<br>`;
                else if(input.value.toLowerCase() == 'about') out.innerHTML += `Lutz Lab v1.0 | SMPN 1 Sampit<br>`;
                else if(input.value.toLowerCase() == 'clear') out.innerHTML = "";
                else out.innerHTML += `Error: Command not found.<br>`;
                
                input.value = "";
                out.scrollTop = out.scrollHeight; // Auto-scroll
            }
        }

        // 5. Kalkulator
        function hitung() {
            let h = document.getElementById("h").value, b = document.getElementById("b").value, t = document.getElementById("t").value;
            if(!h || !b || !t) { alert("Isi tanggal lengkap!"); return; }
            let d = new Date(), birth = new Date(t, b-1, h);
            let age = new Date(d - birth);
            document.getElementById("hasil").innerText = (age.getUTCFullYear()-1970) + " Thn, " + age.getUTCMonth() + " Bln";
        }
    </script>
</body>
</html>
