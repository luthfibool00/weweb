<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supian - by pyy</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; overflow-y: auto; overflow-x: hidden; position: relative; }

        /* Background & Lirik Latar */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: transparent url('https://cdn.pixabay.com/photo/2016/01/27/15/25/space-1164579_960_720.png') repeat top center; animation: moveStars 150s linear infinite; opacity: 0.3; }
        @keyframes moveStars { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }

        /* LIRIK LATAR BELAKANG (Floating) */
        #syncLyrics {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; text-align: center; font-size: 3rem; font-weight: bold;
            color: #58a6ff; opacity: 0.15; z-index: 1; pointer-events: none;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.5);
            transition: opacity 0.5s ease;
        }

        /* Kontainer Utama */
        .container { text-align: center; z-index: 2; padding: 20px; width: 100%; max-width: 600px; background: rgba(13, 17, 23, 0.4); border-radius: 20px; }

        .profile-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #58a6ff; box-shadow: 0 0 20px rgba(88, 166, 255, 0.5); margin-bottom: 20px; }
        h1 { font-size: 4.5rem; margin: 0; letter-spacing: 8px; background: linear-gradient(90deg, #58a6ff, #1f6feb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .description { font-size: 1.1rem; margin-top: 15px; color: #8b949e; line-height: 1.6; }
        .author { margin-top: 10px; font-size: 1rem; border-top: 1px dashed #30363d; padding-top: 15px; }
        .author span { color: #58a6ff; font-weight: bold; }

        .btn-glow, .btn-music { display: inline-block; margin-top: 20px; padding: 10px 25px; text-decoration: none; font-size: 1rem; border-radius: 8px; cursor: pointer; }
        .btn-glow { color: #58a6ff; border: 2px solid #58a6ff; }
        .btn-music { color: #0d1117; border: 2px solid #58a6ff; background: #58a6ff; margin-left: 10px; }

        /* Kalkulator Umur */
        .countdown-box { margin: 30px auto 20px auto; padding: 15px; width: 90%; max-width: 350px; border: 1px dashed #58a6ff; background-color: rgba(13, 17, 23, 0.8); border-radius: 10px; }
        .input-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .input-date { background: transparent; color: #58a6ff; border: 1px solid #58a6ff; padding: 8px 5px; border-radius: 5px; width: 30%; text-align: center; }
        .btn-calc { background: #58a6ff; color: #0d1117; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #hasilUmur { margin-top: 10px; color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="stars"></div>
    
    <!-- Lirik di Latar Belakang -->
    <div id="syncLyrics"></div>

    <div class="container">
        <img src="foto.jpg" alt="Foto Profil" class="profile-pic">
        <h1>SUPIAN</h1>
        <p class="description">wellcome le! Halaman ini adalah ruang dokumentasi eksperimen kode dan proyek dari ltzy murid, SMP Negeri 1 Sampit.</p>
        <div class="author">Dibuat oleh <span>pyy</span></div>

        <div>
            <a href="https://github.com/luthfibool00" class="btn-glow" target="_blank">Lihat Repositori</a>
            <button id="musicBtn" class="btn-music" onclick="toggleMusic()">🎵 Play Music</button>
        </div>
        
        <div class="countdown-box">
            <div style="font-size: 0.8rem; margin-bottom: 10px;">🎂 KALKULATOR UMUR</div>
            <div class="input-group">
                <input type="number" id="inputHari" class="input-date" placeholder="Tgl">
                <input type="number" id="inputBulan" class="input-date" placeholder="Bln">
                <input type="number" id="inputTahun" class="input-date" placeholder="Thn">
            </div>
            <button class="btn-calc" onclick="hitungUmur()">Hitung</button>
            <div id="hasilUmur"></div>
        </div>

        <audio id="bgMusic" loop>
            <source src="musik.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        var audio = document.getElementById("bgMusic");
        var btn = document.getElementById("musicBtn");
        var lyricBox = document.getElementById("syncLyrics");

        const lirikLagu = [
            { time: 0, text: "" },
            { time: 10, text: "Meskipun apa kata mereka" },
            { time: 15, text: "Takkan mengubah cintaku" },
            { time: 20, text: "Walaupun dunia mencela" },
            { time: 25, text: "Takkan goyahkan hatiku" }
        ];

        audio.addEventListener("timeupdate", function() {
            let currentTime = audio.currentTime;
            let currentText = "";
            for (let i = 0; i < lirikLagu.length; i++) {
                if (currentTime >= lirikLagu[i].time) currentText = lirikLagu[i].text;
            }
            lyricBox.innerHTML = currentText;
        });

        function toggleMusic() {
            if (audio.paused) { audio.play(); btn.innerHTML = "⏸️ Pause"; }
            else { audio.pause(); btn.innerHTML = "🎵 Play"; }
        }

        function hitungUmur() {
            let h = parseInt(document.getElementById("inputHari").value);
            let b = parseInt(document.getElementById("inputBulan").value);
            let t = parseInt(document.getElementById("inputTahun").value);
            if (isNaN(h) || isNaN(b) || isNaN(t)) { alert("Isi lengkap dulu le!"); return; }
            let birthDate = new Date(t, b - 1, h);
            let today = new Date();
            let ageYears = today.getFullYear() - birthDate.getFullYear();
            let ageMonths = today.getMonth() - birthDate.getMonth();
            let ageDays = today.getDate() - birthDate.getDate();
            if (ageDays < 0) { ageMonths--; let lastMonth = new Date(today.getFullYear(), today.getMonth(), 0); ageDays += lastMonth.getDate(); }
            if (ageMonths < 0) { ageYears--; ageMonths += 12; }
            document.getElementById("hasilUmur").innerHTML = ageYears + " Thn, " + ageMonths + " Bln, " + ageDays + " Hari";
        }
    </script>
</body>
</html>
