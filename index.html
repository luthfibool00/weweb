<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supian - by pyy</title>
    <style>
        /* Desain untuk tampilan di Browser / Website */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d1117; /* Warna latar belakang gelap khas GitHub */
            color: #c9d1d9; 
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: 8px;
            /* Membuat efek teks gradasi dan menyala */
            background: linear-gradient(90deg, #58a6ff, #1f6feb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 25px rgba(88, 166, 255, 0.4);
        }

        p {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #8b949e;
        }

        .author {
            margin-top: 40px;
            font-size: 1rem;
            border-top: 1px solid #30363d;
            padding-top: 15px;
        }

        .author span {
            color: #58a6ff;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SUPIAN</h1>
        <p>Welcome to this project</p>
        <div class="author">Dibuat oleh <span>pyy</span></div>
