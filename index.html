<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lutz - Cyber Security Lab</title>
    <style>
        :root { 
            --accent: #00ff66; 
            --bg: #050505; 
            --card-bg: rgba(0, 15, 5, 0.85); 
            --border: #00441a; 
            --text: #c9d1d9; 
            --glow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; padding-bottom: 50px; }
        
        /* LOGIN SCREEN */
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-nama { padding: 15px; border: 1px solid var(--accent); background: #000; color: var(--accent); text-align: center; margin-bottom: 15px; width: 250px; font-family: inherit; font-size: 1rem; outline: none; border-radius: 4px; }
        .btn-start { padding: 12px 30px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.3s; border-radius: 4px; text-transform: uppercase; letter-spacing: 2px;}
        .btn-start:hover { background: var(--accent); color: #000; box-shadow: var(--glow); }

        /* KONTEN UTAMA */
        .main-wrapper { display: none; padding: 20px; max-width: 600px; margin: auto; }
        .section { margin-bottom: 25px; padding: 25px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--glow); }
        
        h1 { margin: 0 0 10px 0; font-size: 1.8rem; letter-spacing: 3px; color: var(--accent); text-shadow: var(--glow); }
        h2 { font-size: 1rem; color: #888; text-transform: uppercase; margin-bottom: 15px; }

        /* BUTTON & INPUT UMUM */
        .ctrl-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 16px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.3s; width: 100%; margin-top: 10px; border-radius: 3px; text-transform: uppercase; }
        .ctrl-btn:hover { background: var(--accent); color: #000; }
        .input-box { background: #000; border: 1px solid var(--border); color: var(--accent); padding: 10px; width: 25%; text-align: center; outline: none; font-family: inherit; border-radius: 3px; }

        /* TERMINAL KHUSUS HP */
        .terminal-box { background: #000; padding: 15px; border: 1px solid var(--border); height: 150px; overflow-y: auto; font-size: 0.85rem; color: var(--accent); line-height: 1.4; }
        .terminal-form { display: flex; margin-top: 10px; background: #000; border: 1px solid var(--border); padding: 10px; align-items: center; }
        .terminal-prefix { color: var(--accent); font-size: 0.85rem; margin-right: 8px; font-weight: bold; }
        .terminal-input { background: transparent; border: none; color: var(--text); width: 100%; outline: none; font-family: inherit; font-size: 0.85rem; }

        /* NETWORK RESULT BOX */
        .net-result-box { margin-top: 15px; font-size: 0.85rem; color: #888; text-align: left; min-height: 60px; background: #000; padding: 10px; border: 1px dashed var(--border); }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-overlay">
        <input type="text" id="namaInput" class="input-nama" placeholder="Masukkan ID Agen..." autocomplete="off">
        <button class="btn-start" onclick="mulai()">INITIALIZE</button>
    </div>

    <!-- 2. KONTEN UTAMA -->
    <div class="main-wrapper" id="konten">
        
        <!-- HEADER -->
        <div class="section">
            <h1>LUTZ LAB</h1>
            <p style="margin-top: 0; font-size: 0.9rem;">Access granted: <span id="namaUser" style="color:var(--accent); font-weight:bold;"></span></p>
            <button class="ctrl-btn" id="music-btn" onclick="toggleMusic()">🎵 AKTIFKAN MUSIK</button>
        </div>

        <!-- TERMINAL -->
        <div class="section">
            <h2>// SECURE TERMINAL</h2>
            <div class="terminal-box" id="terminal-output">
                System initialized...<br>
                Type 'help' to see available commands.<br>
            </div>
            
            <form class="terminal-form" onsubmit="handleTerminal(event); return false;">
                <span class="terminal-prefix">root@lutz:~$</span>
                <input type="text" id="terminal-text" class="terminal-input" autocomplete="off" autocapitalize="off" spellcheck="false">
                <button type="submit" style="display: none;"></button>
            </form>
        </div>

        <!-- LAB & NETWORK -->
        <div class="section">
            <h2>// LAB & NETWORK</h2>
            
            <div style="display: flex; gap: 10px;">
                <button class="ctrl-btn" onclick="runPing()" style="margin-top: 0;">PING</button>
                <button class="ctrl-btn" onclick="runRealSpeedTest()" style="margin-top: 0;">REAL SPEED TEST</button>
            </div>
            
            <div id="net-result" class="net-result-box">
                [ NETWORK MODULE READY ]<br>
                Silakan pilih opsi uji jaringan di atas.
            </div>
            
            <div style="margin-top:30px;">
                <h2 style="font-size: 0.85rem; border-bottom: 1px dashed var(--border); padding-bottom: 5px;">// AGE CALCULATOR</h2>
                <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 15px;">
                    <input type="number" id="h" class="input-box" placeholder="Tgl">
                    <input type="number" id="b" class="input-box" placeholder="Bln">
                    <input type="number" id="t" class="input-box" placeholder="Thn">
                </div>
                <button class="ctrl-btn" onclick="hitung()">HITUNG USIA PRECISI</button>
                <div id="hasil" style="margin-top:15px; text-align:center; font-weight:bold; color:var(--accent);"></div>
            </div>
        </div>
    </div>

    <!-- MUSIK -->
    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <!-- SCRIPT -->
    <script>
        function mulai() {
            let nama = document.getElementById("namaInput").value.trim();
            if(nama === "") { alert("ID Agen tidak boleh kosong!"); return; }
            document.getElementById("namaUser").innerText = nama;
            document.getElementById("login-overlay").style.display = 'none';
            document.getElementById("konten").style.display = 'block';
        }

        function toggleMusic() {
            let music = document.getElementById("bgMusic");
            let btn = document.getElementById("music-btn");
            try {
                if (music.paused) {
                    music.play();
                    btn.innerText = "🎵 MUSIK: ON";
                    btn.style.background = "var(--accent)";
                    btn.style.color = "#000";
                } else {
                    music.pause();
                    btn.innerText = "🎵 AKTIFKAN MUSIK";
                    btn.style.background = "transparent";
                    btn.style.color = "var(--accent)";
                }
            } catch(e) {
                alert("Browser memblokir atau file musik.mp3 tidak ditemukan.");
            }
        }

        // --- NETWORK PING TEST ---
        function runPing() {
            let out = document.getElementById("net-result");
            out.innerHTML = "Pinging 192.168.87.1 (Gateway) with 32 bytes of data...<br>";
            setTimeout(() => {
                let ms = Math.floor(Math.random() * 20) + 5; 
                out.innerHTML += `Reply from 192.168.87.1: time=<span style="color:var(--accent); font-weight:bold;">${ms}ms</span> TTL=64<br>`;
                out.innerHTML += `<span style="color:var(--accent);">[ PING TEST COMPLETED ]</span>`;
            }, 1000);
        }

        // --- REAL NETWORK SPEED TEST ---
        function runRealSpeedTest() {
            let out = document.getElementById("net-result");
            out.innerHTML = "[!] Menghubungkan ke server...<br>Mengunduh Payload Test (2.7 MB)...<br>";

            // Menggunakan gambar dari server luar untuk tes kecepatan nyata
            let imageAddr = "https://upload.wikimedia.org/wikipedia/commons/a/a6/Brandenburger_Tor_abends.jpg";
            let downloadSize = 2700000; // Ukuran file (sekitar 2.7 Juta Bytes)

            let startTime, endTime;
            let download = new Image();

            // Jika berhasil didownload
            download.onload = function () {
                endTime = (new Date()).getTime();
                showSpeedResults(startTime, endTime, downloadSize, out);
            }

            // Jika gagal didownload (misal no internet)
            download.onerror = function () {
                out.innerHTML += `<span style="color:red; font-weight:bold;">[!] ERROR: Koneksi terputus atau diblokir.</span>`;
            }

            // Memulai download dengan parameter acak agar tidak nyangkut di Cache (History)
            startTime = (new Date()).getTime();
            download.src = imageAddr + "?cachebreaker=" + startTime;
        }

        function showSpeedResults(start, end, size, out) {
            let duration = (end - start) / 1000; // Waktu dalam detik
            let bitsLoaded = size * 8;
            let speedBps = (bitsLoaded / duration);
            let speedMbps = (speedBps / 1024 / 1024).toFixed(2); // Dikonversi ke Mbps

            out.innerHTML = `Payload diterima dalam ${duration} detik.<br>`;
            out.innerHTML += `Download : <span style="color:var(--accent); font-weight:bold;">${speedMbps} Mbps</span><br>`;
            
            // Estimasi Upload
            out.innerHTML += `Testing Upload... <span style="color:var(--accent);">[||||||||||]</span><br>`;
            setTimeout(() => {
                let ulSpeed = (speedMbps * (Math.random() * 0.4 + 0.2)).toFixed(2); // Estimasi logis upload
                out.innerHTML = `Payload diterima dalam ${duration} detik.<br>`;
                out.innerHTML += `Download : <span style="color:var(--accent); font-weight:bold;">${speedMbps} Mbps</span><br>`;
                out.innerHTML += `Upload   : <span style="color:var(--accent); font-weight:bold;">${ulSpeed} Mbps (Est)</span><br>`;
                out.innerHTML += `<span style="color:var(--accent);">[ NETWORK TEST SECURED ]</span>`;
            }, 1200);
        }

        function handleTerminal(e) {
            e.preventDefault(); 
            let input = document.getElementById("terminal-text");
            let out = document.getElementById("terminal-output");
            let val = input.value.trim();
            
            if(val === "") return; 
            
            out.innerHTML += `root@lutz:~$ ${val}<br>`;
            let cmd = val.toLowerCase();
            
            if(cmd === 'help') {
                out.innerHTML += `AVAILABLE COMMANDS:<br> - help  : Tampilkan info ini<br> - ping  : Uji koneksi jaringan<br> - about : Informasi sistem<br> - clear : Bersihkan layar terminal<br>`;
            } 
            else if(cmd === 'ping') {
                out.innerHTML += `Koneksi gateway aman. Gunakan tombol 'PING' di bawah untuk tes detail.<br>`;
            } 
            else if(cmd === 'about') {
                out.innerHTML += `[ SYSTEM INFO ]<br>Owner   : Lutz<br>Class   : 87<br>School  : SMP Negeri 1 Sampit<br>Status  : Online & Secured<br>`;
            } 
            else if(cmd === 'clear') {
                out.innerHTML = "";
            } 
            else {
                out.innerHTML += `Error: Command '${val}' not found. Type 'help'.<br>`;
            }
            
            input.value = ""; 
            out.scrollTop = out.scrollHeight; 
        }

        function hitung() {
            let h = document.getElementById("h").value;
            let b = document.getElementById("b").value;
            let t = document.getElementById("t").value;
            
            if(!h || !b || !t) { 
                document.getElementById("hasil").innerText = "[!] Masukkan tanggal lengkap."; 
                document.getElementById("hasil").style.color = "red";
                return; 
            }
            
            let d = new Date(), birth = new Date(t, b-1, h);
            let age = new Date(d - birth);
            let tahun = age.getUTCFullYear() - 1970;
            let bulan = age.getUTCMonth();
            
            document.getElementById("hasil").style.color = "var(--accent)";
            document.getElementById("hasil").innerText = `Target berusia: ${tahun} Tahun, ${bulan} Bulan`;
        }
    </script>
</body>
</html>
