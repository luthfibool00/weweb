<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supian - by pyy</title>
    <style>
        /* Pengaturan Dasar & Background */
        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: #0d1117; color: #c9d1d9; 
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            overflow-y: auto; overflow-x: hidden; position: relative;
        }

        /* Efek Partikel Bintang */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: transparent url('https://cdn.pixabay.com/photo/2016/01/27/15/25/space-1164579_960_720.png') repeat top center;
            animation: moveStars 150s linear infinite; opacity: 0.3;
        }
        @keyframes moveStars { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }

        /* Kontainer Utama */
        .container { text-align: center; z-index: 1; padding: 20px; width: 100%; max-width: 600px; }

        /* Foto Profil */
        .profile-pic {
            width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
            border: 3px solid #58a6ff; box-shadow: 0 0 20px rgba(88, 166, 255, 0.5);
            margin-bottom: 20px; opacity: 0; animation: fadeIn 1s ease-in forwards; animation-delay: 0.5s;
        }

        /* Efek Mengetik pada Judul */
        .typewriter { display: inline-block; }
        h1 {
            font-size: 4.5rem; margin: 0; letter-spacing: 8px;
            background: linear-gradient(90deg, #58a6ff, #1f6feb);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 25px rgba(88, 166, 255, 0.4);
            overflow: hidden; border-right: 4px solid #58a6ff; white-space: nowrap; width: 0;
            animation: typing 2s steps(6, end) forwards, blink 0.8s infinite; animation-delay: 1s; 
        }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #58a6ff; } }

        /* Teks Lirik Dewa 19 */
        .lyrics {
            margin-top: 15px; font-style: italic; color: #8b949e; line-height: 1.5; font-size: 0.95rem;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.2); opacity: 0;
            animation: fadeIn 1s ease-in forwards; animation-delay: 2.8s;
        }

        /* Teks Deskripsi */
        .description {
            font-size: 1.1rem; margin-top: 15px; color: #8b949e; line-height: 1.6;
            opacity: 0; animation: fadeIn 1s ease-in forwards; animation-delay: 3.5s; 
        }

        /* Info Pembuat */
        .author {
            margin-top: 30px; font-size: 1rem; border-top: 1px dashed #30363d; padding-top: 15px;
            opacity: 0; animation: fadeIn 1s ease-in forwards; animation-delay: 4s;
        }
        .author span { color: #58a6ff; font-weight: bold; letter-spacing: 2px; }

        /* Tombol Repositori & Musik */
        .btn-glow, .btn-music {
            display: inline-block; margin-top: 20px; padding: 10px 25px;
            text-decoration: none; font-size: 1rem; border-radius: 8px; font-family: inherit;
            transition: 0.3s ease-in-out; cursor: pointer; opacity: 0;
            animation: fadeIn 1s ease-in forwards; animation-delay: 4.5s;
        }
        .btn-glow { color: #58a6ff; border: 2px solid #58a6ff; background-color: rgba(13, 17, 23, 0.8); }
        .btn-glow:hover { background-color: #58a6ff; color: #0d1117; box-shadow: 0 0 15px #58a6ff; }
        
        .btn-music { color: #0d1117; border: 2px solid #58a6ff; background: #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.5); font-weight: bold; margin-left: 10px; }
        .btn-music:hover { background: transparent; color: #58a6ff; box-shadow: none; }

        /* Kotak Kalkulator Umur (VERSI KETIK) */
        .countdown-box {
            margin: 30px auto 20px auto; padding: 15px; width: 90%; max-width: 350px;
            border: 1px dashed #58a6ff; background-color: rgba(13, 17, 23, 0.6);
            border-radius: 10px; opacity: 0; animation: fadeIn 1s ease-in forwards; animation-delay: 5s;
        }
        .countdown-title { font-size: 0.9rem; color: #8b949e; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Barisan Kotak Input */
        .input-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        
        .input-date {
            background-color: transparent; color: #58a6ff; border: 1px solid #58a6ff;
            padding: 8px 5px; border-radius: 5px; font-family: inherit; font-size: 1rem;
            outline: none; text-align: center; width: 30%;
        }
        .input-date::placeholder { color: rgba(88, 166, 255, 0.4); font-size: 0.85rem; }
        
        .btn-calc {
            background: #58a6ff; color: #0d1117; border: 1px solid #58a6ff;
            padding: 8px 20px; border-radius: 5px; cursor: pointer;
            font-family: inherit; font-weight: bold; transition: 0.3s;
        }
        .btn-calc:hover { background: transparent; color: #58a6ff; }
        
        #hasilUmur { margin-top: 15px; font-size: 1.1rem; color: #58a6ff; font-weight: bold; text-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        
        <img src="foto.jpg" alt="Foto Profil" class="profile-pic">

        <div class="typewriter">
            <h1>SUPIAN</h1>
        </div>
        
        <div class="lyrics">
            "Meskipun apa kata mereka, takkan mengubah cintaku<br>Walaupun dunia mencela, takkan goyahkan hatiku"
        </div>
        
        <p class="description">
            wellcome le! Halaman ini adalah ruang dokumentasi eksperimen kode dan proyek dari ltzy murid, SMP Negeri 1 Sampit.
        </p>

        <div class="author">Dibuat oleh <span>pyy</span></div>

        <div>
            <a href="https://github.com/luthfibool00" class="btn-glow" target="_blank">Lihat Repositori</a>
            <button id="musicBtn" class="btn-music" onclick="toggleMusic()">🎵 Play Music</button>
        </div>
        
        <!-- Kalkulator Umur (Versi Tiga Kotak) -->
        <div class="countdown-box">
            <div class="countdown-title">🎂 Kalkulator Umur</div>
            <div class="input-group">
                <input type="number" id="inputHari" class="input-date" placeholder="Tgl (1-31)">
                <input type="number" id="inputBulan" class="input-date" placeholder="Bln (1-12)">
                <input type="number" id="inputTahun" class="input-date" placeholder="Thn (Misal 2008)">
            </div>
            <button class="btn-calc" onclick="hitungUmur()">Hitung Umur</button>
            <div id="hasilUmur"></div>
        </div>

        <audio id="bgMusic" loop>
            <source src="musik.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>
        function toggleMusic() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("musicBtn");
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏸️ Pause Music";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Play Music";
            }
        }

        // Mesin Hitung Umur Versi Ketik
        function hitungUmur() {
            let h = parseInt(document.getElementById("inputHari").value);
            let b = parseInt(document.getElementById("inputBulan").value);
            let t = parseInt(document.getElementById("inputTahun").value);
            
            // Cek kalau ada kotak yang kosong
            if (isNaN(h) || isNaN(b) || isNaN(t)) {
                document.getElementById("hasilUmur").innerHTML = "Isi angka lengkapnya dulu, le!";
                return;
            }

            // Bulan di javascript dimulai dari 0 (Januari = 0), jadi b harus dikurangi 1
            let birthDate = new Date(t, b - 1, h);
            let today = new Date();

            let ageYears = today.getFullYear() - birthDate.getFullYear();
            let ageMonths = today.getMonth() - birthDate.getMonth();
            let ageDays = today.getDate() - birthDate.getDate();

            if (ageDays < 0) {
                ageMonths--;
                let lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                ageDays += lastMonth.getDate();
            }
            if (ageMonths < 0) {
                ageYears--;
                ageMonths += 12;
            }

            // Tampilkan Hasil
            document.getElementById("hasilUmur").innerHTML = 
                ageYears + " Tahun, " + ageMonths + " Bulan, " + ageDays + " Hari";
        }
    </script>
</body>
</html>
