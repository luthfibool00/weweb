<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lutz // Cyber Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #00ff66; --bg: #030a05; --card-bg: rgba(0, 10, 5, 0.9); 
            --border: #00441a; --text: #c9d1d9; --glow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        body { 
            margin: 0; background-color: var(--bg); color: var(--text); 
            font-family: 'Share Tech Mono', monospace; overflow-x: hidden;
            background-image: radial-gradient(circle at 2px 2px, rgba(0, 255, 102, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* Scanline Effect */
        body::before {
            content: " "; position: fixed; inset: 0; pointer-events: none; z-index: 999;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
        }

        /* Boot Screen */
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 10000; padding: 20px; font-size: 0.8rem; }
        .boot-log { color: #555; margin-bottom: 2px; }

        /* Main UI */
        .wrapper { max-width: 600px; margin: auto; padding: 20px; display: none; }
        .section { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; position: relative; }
        
        h1 { color: var(--accent); font-size: 2rem; margin: 0; text-shadow: var(--glow); letter-spacing: 5px; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-box { border: 1px solid var(--border); padding: 8px; text-align: center; }
        .stat-val { color: var(--accent); font-weight: bold; }

        .ctrl-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        .ctrl-btn:hover { background: var(--accent); color: #000; }
        
        .terminal-box { background: #000; border: 1px solid var(--border); height: 150px; overflow-y: auto; padding: 10px; font-size: 0.8rem; color: var(--accent); }
    </style>
</head>
<body>

    <div id="boot-screen"><div id="boot-text"></div></div>

    <div id="login-overlay" style="position:fixed; inset:0; display:none; flex-direction:column; justify-content:center; align-items:center; background:var(--bg);">
        <input type="text" id="namaInput" placeholder="ENTER AGENT ID" style="background:#000; border:1px solid var(--accent); color:var(--accent); padding:15px; text-align:center; width:200px; margin-bottom:15px; font-family:inherit;">
        <button onclick="mulai()" style="background:var(--accent); border:none; padding:10px 20px; font-weight:bold; cursor:pointer;">ACCESS SYSTEM</button>
    </div>

    <div class="wrapper" id="konten">
        <div class="section">
            <h1>LUTZ LAB</h1>
            <div class="data-grid">
                <div class="stat-box"><div style="font-size:0.6rem">CPU</div><div id="cpu" class="stat-val">0%</div></div>
                <div class="stat-box"><div style="font-size:0.6rem">RAM</div><div id="ram" class="stat-val">0%</div></div>
                <div class="stat-box"><div style="font-size:0.6rem">UPTIME</div><div id="up" class="stat-val">00:00</div></div>
            </div>
            <button class="ctrl-btn" id="music-btn" onclick="toggleMusic()">🎵 AUDIO ENGINE</button>
        </div>

        <div class="section">
            <h2>TERMINAL</h2>
            <div class="terminal-box" id="term-out">System initialized...</div>
            <input type="text" id="term-in" onkeydown="if(event.key==='Enter') runCmd()" style="width:100%; background:#000; border:1px solid var(--border); color:var(--text); padding:10px; margin-top:5px; box-sizing:border-box;" placeholder="root@lutz:~#">
        </div>
        
        <div class="section">
            <h2>DIAGNOSTICS</h2>
            <button class="ctrl-btn" onclick="runPing()">PING GATEWAY</button>
            <div id="net-res" style="margin-top:10px; font-size: 0.8rem; color: var(--accent);"></div>
        </div>
    </div>

    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <script>
        // Boot Sequence
        window.onload = () => {
            let logs = ["Loading Kernel...", "Scanning Hardware...", "Securing Connection...", "Ready."];
            let i = 0;
            let interval = setInterval(() => {
                document.getElementById("boot-text").innerHTML += `<div class="boot-log">${logs[i]}</div>`;
                i++;
                if(i >= logs.length) {
                    clearInterval(interval);
                    setTimeout(() => { document.getElementById("boot-screen").style.display='none'; document.getElementById("login-overlay").style.display='flex'; }, 500);
                }
            }, 500);
        };

        function mulai() {
            document.getElementById("login-overlay").style.display = 'none';
            document.getElementById("konten").style.display = 'block';
        }

        // Monitoring
        setInterval(() => {
            document.getElementById("cpu").innerText = Math.floor(Math.random()*30+5) + "%";
            document.getElementById("ram").innerText = Math.floor(Math.random()*20+40) + "%";
        }, 1500);

        function runCmd() {
            let input = document.getElementById("term-in");
            let out = document.getElementById("term-out");
            let cmd = input.value;
            out.innerHTML += `<br>root@lutz:~# ${cmd}<br> Executing...`;
            input.value = "";
            out.scrollTop = out.scrollHeight;
        }

        async function runPing() {
            document.getElementById("net-res").innerText = "Pinging...";
            await new Promise(r => setTimeout(r, 1000));
            document.getElementById("net-res").innerText = "Reply: 12ms (Stable)";
        }

        function toggleMusic() {
            let m = document.getElementById("bgMusic");
            m.paused ? m.play() : m.pause();
        }
    </script>
</body>
</html>
